changelog:
  categories:
    - title: 🛡️ Security
      labels:
        - 'Security'
    - title: 🎉 Features
      labels:
        - '*'
      exclude:
        labels:
          - dependencies
          - Bug
          - documentation
          - Security

    - title: 🛠 Bug fixes
      labels:
        - 'Bug'

    - title: 📘 Documentation
      labels:
        - documentation

    - title: ⤴ Dependencies
      labels:
        - dependencies
