changelog:
  categories:
    - title: 🎉 Features
      labels:
        - '*'
      exclude:
        labels:
          - dependencies
          - Bug
          - documentation
          - Tests
          - CI

    - title: 🛠 Bug fixes
      labels:
        - 'Bug'

    - title: 📘 Documentation
      labels:
        - documentation

    - title: ✅ Tests
      labels:
        - 'Tests'

    - title: 👷 CI
      labels:
        - 'CI'
        - github_actions

    - title: ⤴ Dependencies
      labels:
        - dependencies